name: Continuous integration

on:
  pull_request:
    branches:
      - staging
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g corepack@latest
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm nuxi prepare
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g corepack@latest
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm nuxi prepare
      - run: pnpm test
